<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Pickle Project Gentri — Open Play Check-In</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef5fb;color:#102a43}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(520px,100%);background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 18px 55px rgba(15,55,85,.16)}
.hero{background:#0b4f8a;color:white;text-align:center;padding:30px 24px}h1{margin:0 0 6px;font-size:27px}.hero b{font-size:18px}
.body{padding:26px}label{display:block;font-weight:800;margin:0 0 7px}input,select{width:100%;padding:14px;border:1px solid #b8c9d8;border-radius:12px;font-size:16px;margin-bottom:17px;background:white}
button{width:100%;padding:16px;border:0;border-radius:13px;background:#0b4f8a;color:white;font-size:17px;font-weight:900;cursor:pointer}
button:disabled{opacity:.55}.msg{display:none;padding:13px;border-radius:10px;margin-bottom:16px;font-weight:700}
.err{background:#fee2e2;color:#991b1b}.success{display:none;text-align:center;padding:38px 25px}.check{width:70px;height:70px;border-radius:50%;background:#dcfce7;color:#166534;display:grid;place-items:center;margin:auto auto 18px;font-size:40px;font-weight:900}
.success h2{color:#0b4f8a;line-height:1.35}.privacy{font-size:12px;color:#64748b;text-align:center;line-height:1.45;margin-top:15px}
</style></head>
<body><div class="wrap"><main class="card">
<section class="hero"><h1>The Pickle Project Gentri</h1><b>OPEN PLAY CHECK-IN</b></section>
<section class="body" id="formView">
<div id="err" class="msg err"></div>
<label>Your Name</label><input id="name" autocomplete="name" placeholder="Enter your full name">
<label>Gender</label><select id="gender"><option value="">Select gender</option><option>Female</option><option>Male</option><option>Unspecified</option></select>
<label>Open Play Level</label><select id="level"><option value="">Select level</option><option>Beginner</option><option>Low Intermediate</option><option>High Intermediate/Advanced</option></select>
<button id="submitBtn" onclick="submitCheckin()">CHECK IN TO GENTRI OPEN PLAY</button>
<div class="privacy">This page is only for your Open Play check-in. Other players' information is not displayed.</div>
</section>
<section class="success" id="successView"><div class="check">✓</div>
<h2>You're checked in! Welcome to The Pickle Project Gentri Open Play.</h2>
<p>Your check-in was sent successfully.</p></section>
</main></div>
<script>
const SUPABASE_URL='https://ilonhufjhtuhakywomom.supabase.co';
const SUPABASE_KEY='sb_publishable_-tT-4PZl6uJDjSPAo1flpA_yFBintoX';
function errorMsg(m){const e=document.getElementById("err");e.textContent=m;e.style.display="block"}
async function submitCheckin(){
 const name=document.getElementById("name").value.trim().replace(/\s+/g," ");
 const gender=document.getElementById("gender").value;
 const level=document.getElementById("level").value;
 if(!name)return errorMsg("Please enter your name.");
 if(!gender)return errorMsg("Please select your gender.");
 if(!level)return errorMsg("Please select your Open Play level.");
 const b=document.getElementById("submitBtn"); b.disabled=true;b.textContent="CHECKING IN...";
 document.getElementById("err").style.display="none";
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/gentri_open_play_checkins",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
   body:JSON.stringify({player_name:name,gender:gender,player_level:level,status:"checked_in"})
  });
  if(!r.ok)throw new Error(await r.text());
  document.getElementById("formView").style.display="none";
  document.getElementById("successView").style.display="block";
 }catch(e){
  console.error(e);errorMsg("Check-in could not be sent. Please ask the Open Play staff for assistance.");
  b.disabled=false;b.textContent="CHECK IN TO GENTRI OPEN PLAY";
 }
}
</script></body></html>
